name: Android app

on:
  push:
    paths: ["android/**", "whoop/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "whoop/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Protocol tests and debug APK
        run: ./gradlew --no-daemon :protocol:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: whoop5-lab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whoop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]' && pytest -q
